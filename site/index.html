<body>
<div id="stage-wrap">
  <canvas id="pulse" width="1920" height="1080"></canvas>
  <button id="playBtn" aria-label="Play"></button>
</div>
<div id="devnote">phase 3 — sweep preview</div>

<script>
const STAGE_W = 1920, STAGE_H = 1080;
const BASELINE_Y = 540;
const AMP_MAX = 360;
const MARGIN_X = 90;
const TOP_RESERVED = 140;   // space reserved for HUD (phase 4)
const TURBULENCE_MAX = 46;

const canvas = document.getElementById('pulse');
const ctx = canvas.getContext('2d');

function seededNoise(seed) {
  // deterministic pseudo-random in [-1, 1], stable across re-renders
  const x = Math.sin(seed * 12.9898 + seed * seed * 0.7321) * 43758.5453;
  return ((x - Math.floor(x)) * 2) - 1;
}

function lerp(a, b, t) { return a + (b - a) * t; }

function hexToRgb(hex) {
  const v = parseInt(hex.replace('#', ''), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

function lerpColor(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(lerp(a[0], b[0], t));
  const g = Math.round(lerp(a[1], b[1], t));
  const bl = Math.round(lerp(a[2], b[2], t));
  return `rgb(${r},${g},${bl})`;
}

// Catmull-Rom spline: given control points, return a smooth interpolated
// point at parameter t in [0, n-1] (t between points[i] and points[i+1]).
function catmullRom(points, t) {
  const n = points.length;
  let i = Math.floor(t);
  if (i >= n - 1) i = n - 2;
  const local = t - i;
  const p0 = points[Math.max(0, i - 1)];
  const p1 = points[i];
  const p2 = points[i + 1];
  const p3 = points[Math.min(n - 1, i + 2)];
  const t2 = local * local, t3 = t2 * local;
  const v = 0.5 * (
    (2 * p1) +
    (-p0 + p2) * local +
    (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
    (-p0 + 3 * p1 - 3 * p2 + p3) * t3
  );
  return v;
}

function buildCurve(timeline, samplesPerMinute) {
  const minutes = timeline.minutes;
  const n = minutes.length;
  const momentumPts = minutes.map(m => m.momentum);
  const intensityPts = minutes.map(m => m.intensity);
  const total = (n - 1) * samplesPerMinute;
  const curve = [];
  for (let s = 0; s <= total; s++) {
    const t = s / samplesPerMinute;
    const momentum = catmullRom(momentumPts, t);
    const intensity = Math.max(0, Math.min(1, catmullRom(intensityPts, t)));
    const noise = seededNoise(t * 3.7) * 0.6 + seededNoise(t * 11.3) * 0.4;
    const x = MARGIN_X + (t / (n - 1)) * (STAGE_W - MARGIN_X * 2);
    const y = BASELINE_Y - momentum * AMP_MAX - noise * TURBULENCE_MAX * intensity;
    const colorT = (momentum + 1) / 2; // 0 = away color, 1 = home color
    curve.push({ x, y, momentum, intensity, colorT, minute: t });
  }
  return curve;
}

function minuteToX(minute, n) {
  return MARGIN_X + (minute / (n - 1)) * (STAGE_W - MARGIN_X * 2);
}

function drawBaseline() {
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(MARGIN_X, BASELINE_Y);
  ctx.lineTo(STAGE_W - MARGIN_X, BASELINE_Y);
  ctx.stroke();
}

function drawPeriodMarkers(timeline) {
  const n = timeline.minutes.length;
  const labels = { 1: null, 2: 'HT', 3: 'FT', 4: 'ET', 5: 'PENS' };
  timeline.meta.periods.forEach(p => {
    if (p.period === 1) return;
    const x = minuteToX(p.start, n);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.setLineDash([2, 6]);
    ctx.beginPath();
    ctx.moveTo(x, TOP_RESERVED);
    ctx.lineTo(x, STAGE_H - 60);
    ctx.stroke();
    ctx.setLineDash([]);
    const label = labels[p.period];
    if (label) {
      // Sits below the dashed line's top, clear of the HUD plate above
      // (which ends at y=126) — a period boundary near center-x must not
      // crowd the scoreline/status text sitting there.
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.font = '600 16px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, TOP_RESERVED + 26);
    }
  });
}

function drawCurve(curve, timeline) {
  const home = timeline.meta.home_team.color;
  const away = timeline.meta.away_team.color;

  // glow pass: thick, blurred, segment-colored
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 1; i < curve.length; i++) {
    const a = curve[i - 1], b = curve[i];
    const color = lerpColor(away, home, (a.colorT + b.colorT) / 2);
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 22;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // core pass: thin, sharp
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 8;
  ctx.lineWidth = 2.6;
  for (let i = 1; i < curve.length; i++) {
    const a = curve[i - 1], b = curve[i];
    const color = lerpColor(away, home, (a.colorT + b.colorT) / 2);
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

function curveYAtMinute(curve, minute, samplesPerMinute) {
  const idx = Math.round(minute * samplesPerMinute);
  return curve[Math.max(0, Math.min(curve.length - 1, idx))];
}

function drawGoals(timeline, curve, samplesPerMinute, filterFn) {
  const n = timeline.minutes.length;
  timeline.events.goals.forEach((g, i) => {
    if (filterFn && !filterFn(g, i)) return;
    const pt = curveYAtMinute(curve, g.continuous_minute, samplesPerMinute);
    const color = g.side === 'home' ? timeline.meta.home_team.color : timeline.meta.away_team.color;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pt.x, BASELINE_Y);
    ctx.lineTo(pt.x, pt.y);
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

function drawCards(timeline, curve, samplesPerMinute, filterFn) {
  timeline.events.cards.forEach((c, i) => {
    if (filterFn && !filterFn(c, i)) return;
    const pt = curveYAtMinute(curve, c.continuous_minute, samplesPerMinute);
    const isRed = c.card.toLowerCase().includes('red') || c.card.toLowerCase().includes('second');
    ctx.strokeStyle = isRed ? '#ff2d2d' : '#ffcc33';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(pt.x, pt.y - 14);
    ctx.lineTo(pt.x, pt.y + 14);
    ctx.stroke();
  });
}

// ---------------------------------------------------------------------
// Phase 3: sweep animation, goal/card moments, shootout beat treatment
// ---------------------------------------------------------------------

function easeInOutQuad(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}
function easeOutExpo(t) {
  return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
}

// Wall-clock budget (ms) for each stage of the ~35-40s sweep.
const PHASE_1_MS = 11000;
const HT_PAUSE_MS = 500;
const PHASE_2_MS = 11000;
const FT_PAUSE_MS = 500;
const ET_MS = 7000;
const ET_PAUSE_MS = 400;
const KICK_ANTICIPATION_MS = 400;
const KICK_SNAP_MS = 150;
const KICK_HOLD_MS = 400;
const KICK_MS = KICK_ANTICIPATION_MS + KICK_SNAP_MS + KICK_HOLD_MS;

const GOAL_EFFECT_MS = 550;
const MISS_EFFECT_MS = 420;
const CARD_EFFECT_MS = { yellow: 260, red: 520 };

// Builds an ordered list of {kind:'flow'|'pause'|'shootout', t0, t1, ...}
// segments spanning the whole sweep, from whichever periods this match
// actually has (a match with no extra time simply has no ET segment).
function buildSegments(timeline) {
  const byPeriod = {};
  timeline.meta.periods.forEach(p => { byPeriod[p.period] = p; });
  const segs = [];
  let t = 0;

  segs.push({ kind: 'flow', fromMin: 0, toMin: byPeriod[1].end, t0: t, t1: t + PHASE_1_MS });
  t += PHASE_1_MS;
  segs.push({ kind: 'pause', holdMin: byPeriod[1].end, t0: t, t1: t + HT_PAUSE_MS });
  t += HT_PAUSE_MS;

  if (byPeriod[2]) {
    segs.push({ kind: 'flow', fromMin: byPeriod[2].start, toMin: byPeriod[2].end, t0: t, t1: t + PHASE_2_MS });
    t += PHASE_2_MS;
  }

  const et = byPeriod[4] || byPeriod[3];
  if (et) {
    segs.push({ kind: 'pause', holdMin: byPeriod[2].end, t0: t, t1: t + FT_PAUSE_MS });
    t += FT_PAUSE_MS;
    const etFrom = byPeriod[3] ? byPeriod[3].start : byPeriod[4].start;
    segs.push({ kind: 'flow', fromMin: etFrom, toMin: et.end, t0: t, t1: t + ET_MS });
    t += ET_MS;
  }

  const kicks = timeline.events.shootout;
  if (byPeriod[5] && kicks && kicks.length) {
    segs.push({ kind: 'pause', holdMin: et.end, t0: t, t1: t + ET_PAUSE_MS });
    t += ET_PAUSE_MS;
    segs.push({ kind: 'shootout', kicks, t0: t, t1: t + KICK_MS * kicks.length });
    t += KICK_MS * kicks.length;
  }

  return { segments: segs, totalMs: t };
}

// Evenly-spaced discrete "beat track" for the shootout, laid out after the
// end of regular/extra time rather than following the continuous curve —
// a shootout is alternating discrete kicks, not a continuous flow, so it
// gets its own spatial grammar (reused glow/stroke language, new layout).
function buildShootoutTrack(timeline, etEndMinute) {
  const n = timeline.minutes.length;
  const kicks = timeline.events.shootout || [];
  const trackStartX = minuteToX(etEndMinute, n);
  const trackEndX = STAGE_W - MARGIN_X;
  const spacing = (trackEndX - trackStartX) / (kicks.length + 1);
  const SPIKE = 92, STUB = 40;
  return kicks.map((k, i) => {
    const x = trackStartX + spacing * (i + 1);
    const dir = k.side === 'home' ? -1 : 1; // home spikes up, away spikes down
    const reach = k.outcome === 'scored' ? SPIKE : STUB;
    return { ...k, x, y: BASELINE_Y + dir * reach, trackStartX };
  });
}

function drawShootoutBeat(timeline, beat, revealT) {
  // revealT: 0..1 local reveal progress for this beat's spike growing in
  const home = timeline.meta.home_team.color;
  const away = timeline.meta.away_team.color;
  const color = beat.side === 'home' ? home : away;
  const y = BASELINE_Y + (beat.y - BASELINE_Y) * revealT;

  ctx.strokeStyle = beat.outcome === 'scored' ? color : 'rgba(255,60,60,0.55)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(beat.x, BASELINE_Y);
  ctx.lineTo(beat.x, y);
  ctx.stroke();

  if (revealT > 0.85) {
    if (beat.outcome === 'scored') {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 26;
      ctx.beginPath();
      ctx.arc(beat.x, beat.y, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = '#ff2d2d';
      ctx.lineWidth = 4;
      const s = 9;
      ctx.beginPath();
      ctx.moveTo(beat.x - s, beat.y - s); ctx.lineTo(beat.x + s, beat.y + s);
      ctx.moveTo(beat.x + s, beat.y - s); ctx.lineTo(beat.x - s, beat.y + s);
      ctx.stroke();
    }
  }
}

const NOMINAL_START = { 1: 0, 2: 45, 3: 90, 4: 105, 5: 120 };
const CLOCK_CAP = { 1: 45, 2: 90, 3: 105, 4: 120 };

function periodFor(minute, timeline) {
  const periods = timeline.meta.periods;
  for (const p of periods) if (minute <= p.end + 0.0001) return p;
  return periods[periods.length - 1];
}

// Reconstructs the traditional broadcast clock ("45+3'", "106'") from a
// continuous minute, the inverse of the rebasing done in build_timeline.py.
function liveClockLabel(minute, timeline) {
  const p = periodFor(minute, timeline);
  const cap = CLOCK_CAP[p.period];
  if (cap === undefined) return 'PENALTIES';
  const rel = minute - p.start + NOMINAL_START[p.period];
  const whole = Math.max(0, Math.floor(rel));
  const clock = whole <= cap ? `${whole}'` : `${cap}+${whole - cap}'`;
  return p.period >= 3 ? `EXTRA TIME  ·  ${clock}` : clock;
}

function drawHUDPlate() {
  const w = 940, h = 116, x = STAGE_W / 2 - w / 2, y = 10;
  const grad = ctx.createLinearGradient(0, y, 0, y + h);
  grad.addColorStop(0, 'rgba(6,8,11,0)');
  grad.addColorStop(0.2, 'rgba(6,8,11,0.6)');
  grad.addColorStop(0.82, 'rgba(6,8,11,0.6)');
  grad.addColorStop(1, 'rgba(6,8,11,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + 60, y + h);
  ctx.lineTo(x + w - 60, y + h);
  ctx.stroke();
}

function drawScoreline(timeline, score, bump, pens, statusText) {
  drawHUDPlate();
  const home = timeline.meta.home_team;
  const away = timeline.meta.away_team;
  const scale = bump > 0 ? 1 + 0.14 * bump : 1;

  ctx.save();
  ctx.translate(STAGE_W / 2, 56);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '500 32px Teko';
  ctx.letterSpacing = '2px';
  ctx.fillStyle = home.color;
  ctx.fillText(home.name.toUpperCase(), -196, 4);
  ctx.fillStyle = away.color;
  ctx.fillText(away.name.toUpperCase(), 196, 4);

  ctx.scale(scale, scale);
  ctx.letterSpacing = '0px';
  ctx.font = '700 58px Teko';
  ctx.fillStyle = '#f5f4ef';
  ctx.fillText(`${score.home}  -  ${score.away}`, 0, 6);
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.letterSpacing = '3px';
  ctx.font = '500 21px Teko';
  if (pens) {
    ctx.fillStyle = 'rgba(245,244,239,0.85)';
    ctx.fillText('PENALTIES', STAGE_W / 2, 92);
    ctx.font = '500 19px Teko';
    ctx.fillStyle = 'rgba(245,244,239,0.6)';
    ctx.fillText(`PENS  ${pens.home} - ${pens.away}`, STAGE_W / 2, 114);
  } else if (statusText) {
    ctx.fillStyle = 'rgba(245,244,239,0.62)';
    ctx.fillText(statusText, STAGE_W / 2, 100);
  }
  ctx.letterSpacing = '0px';
}

function drawVignette() {
  const cx = STAGE_W / 2, cy = STAGE_H / 2;
  const grad = ctx.createRadialGradient(cx, cy, STAGE_H * 0.32, cx, cy, STAGE_H * 0.85);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);
}

function drawGoalFlash(timeline, pt, age, duration) {
  const t = Math.min(1, age / duration);
  const alpha = 1 - t;
  const r = 40 + t * 260;
  const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, r);
  grad.addColorStop(0, `rgba(255,255,255,${0.55 * alpha})`);
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);
}

function drawCardStutter(pt, isRed, age, duration) {
  const t = age / duration;
  const alpha = Math.max(0, 1 - t);
  const jitter = Math.sin(t * 60) * 6 * (1 - t);
  ctx.strokeStyle = isRed ? `rgba(255,45,45,${alpha})` : `rgba(255,204,51,${alpha})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(pt.x - 22, pt.y + jitter);
  ctx.lineTo(pt.x + 22, pt.y - jitter);
  ctx.stroke();
}

function drawMissThud(pt, age, duration) {
  const t = Math.min(1, age / duration);
  const alpha = 1 - t;
  const y = pt.y + t * 30;
  ctx.strokeStyle = `rgba(255,45,45,${alpha})`;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(pt.x, pt.y);
  ctx.lineTo(pt.x, y);
  ctx.stroke();
}

async function main() {
  const params = new URLSearchParams(location.search);
  const matchId = params.get('match') || '3869685';
  const res = await fetch(`data/${matchId}.json`);
  const timeline = await res.json();

  const samplesPerMinute = 8;
  const curve = buildCurve(timeline, samplesPerMinute);
  const { segments, totalMs } = buildSegments(timeline);
  const byPeriod = {};
  timeline.meta.periods.forEach(p => { byPeriod[p.period] = p; });
  const etEnd = (byPeriod[4] || byPeriod[3] || byPeriod[2]).end;
  const shootoutTrack = buildShootoutTrack(timeline, etEnd);

  const playBtn = document.getElementById('playBtn');
  const devnote = document.getElementById('devnote');

  function drawIdle() {
    ctx.clearRect(0, 0, STAGE_W, STAGE_H);
    drawBaseline();
    drawPeriodMarkers(timeline);
    ctx.globalAlpha = 0.35;
    drawCurve(curve, timeline);
    drawGoals(timeline, curve, samplesPerMinute);
    drawCards(timeline, curve, samplesPerMinute);
    ctx.globalAlpha = 1;
    drawScoreline(timeline, timeline.meta.final_score, 0, timeline.meta.penalties, 'FULL TIME');
    drawVignette();
    devnote.textContent = `${timeline.meta.home_team.name} ${timeline.meta.final_score.home}-${timeline.meta.final_score.away} ${timeline.meta.away_team.name} — press play`;
  }

  // --- animation state ---
  let triggered, activeEffects, score, pensShown, bump;
  function resetState() {
    triggered = new Set();
    activeEffects = [];
    score = { home: 0, away: 0 };
    pensShown = null;
    bump = 0;
  }
  resetState();

  function findSegment(el) {
    for (const s of segments) if (el < s.t1 || s === segments[segments.length - 1]) return s;
    return segments[segments.length - 1];
  }

  function currentPlayheadAndKick(el) {
    const seg = findSegment(Math.min(el, totalMs));
    if (seg.kind === 'flow') {
      const localT = Math.max(0, Math.min(1, (el - seg.t0) / (seg.t1 - seg.t0)));
      const minute = seg.fromMin + easeInOutQuad(localT) * (seg.toMin - seg.fromMin);
      return { minute, kickIndex: -1, kickPhase: null };
    }
    if (seg.kind === 'pause') {
      return { minute: seg.holdMin, kickIndex: -1, kickPhase: null };
    }
    // shootout
    const rel = Math.max(0, el - seg.t0);
    let kickIndex = Math.min(seg.kicks.length - 1, Math.floor(rel / KICK_MS));
    const within = rel - kickIndex * KICK_MS;
    let phase, x;
    const prevX = kickIndex === 0 ? shootoutTrack[0].trackStartX : shootoutTrack[kickIndex - 1].x;
    const thisX = shootoutTrack[kickIndex].x;
    if (within < KICK_ANTICIPATION_MS) {
      phase = 'anticipation'; x = prevX;
    } else if (within < KICK_ANTICIPATION_MS + KICK_SNAP_MS) {
      phase = 'snap';
      const snapT = (within - KICK_ANTICIPATION_MS) / KICK_SNAP_MS;
      x = lerp(prevX, thisX, easeOutExpo(snapT));
    } else {
      phase = 'hold'; x = thisX;
    }
    return { minute: etEnd, kickIndex, kickPhase: phase, kickX: x };
  }

  function detectTriggers(el, minute, kickIndex, kickPhase) {
    timeline.events.goals.forEach((g, i) => {
      const key = 'goal' + i;
      if (g.continuous_minute <= minute && !triggered.has(key)) {
        triggered.add(key);
        activeEffects.push({ type: 'goal', data: g, t0: el });
        score = g.score_after;
        bump = 1;
      }
    });
    timeline.events.cards.forEach((c, i) => {
      const key = 'card' + i;
      if (c.continuous_minute <= minute && !triggered.has(key)) {
        triggered.add(key);
        activeEffects.push({ type: 'card', data: c, t0: el });
      }
    });
    if (kickIndex >= 0 && kickPhase === 'hold') {
      const key = 'kick' + kickIndex;
      if (!triggered.has(key)) {
        triggered.add(key);
        const k = shootoutTrack[kickIndex];
        if (k.outcome === 'scored') {
          activeEffects.push({ type: 'goal', data: { continuous_minute: minute, x: k.x, y: k.y }, t0: el });
          pensShown = pensShown || { home: 0, away: 0 };
          pensShown = { ...pensShown, [k.side]: pensShown[k.side] + 1 };
          bump = 1;
        } else {
          activeEffects.push({ type: 'miss', data: { x: k.x, y: k.y }, t0: el });
        }
      }
    }
  }

  function renderFrame(el) {
    const { minute, kickIndex, kickPhase, kickX } = currentPlayheadAndKick(el);
    detectTriggers(el, minute, kickIndex, kickPhase);

    ctx.clearRect(0, 0, STAGE_W, STAGE_H);
    drawBaseline();
    drawPeriodMarkers(timeline);

    const revealMinute = Math.min(minute, etEnd);
    const endIdx = Math.max(1, Math.min(curve.length - 1, Math.round(revealMinute * samplesPerMinute)));
    drawCurve(curve.slice(0, endIdx + 1), timeline);
    drawGoals(timeline, curve, samplesPerMinute, (g, i) => triggered.has('goal' + i));
    drawCards(timeline, curve, samplesPerMinute, (c, i) => triggered.has('card' + i));

    shootoutTrack.forEach((beat, i) => {
      if (triggered.has('kick' + i)) drawShootoutBeat(timeline, beat, 1);
    });

    // leading-edge marker
    let tipX, tipY, tipColor;
    if (kickIndex >= 0) {
      tipX = kickX;
      const restingBeat = kickIndex > 0 ? shootoutTrack[kickIndex - 1] : null;
      tipY = kickPhase === 'hold' ? shootoutTrack[kickIndex].y : (restingBeat ? BASELINE_Y : BASELINE_Y);
      tipColor = shootoutTrack[kickIndex].side === 'home' ? timeline.meta.home_team.color : timeline.meta.away_team.color;
    } else {
      const p = curve[endIdx];
      tipX = p.x; tipY = p.y;
      tipColor = lerpColor(timeline.meta.away_team.color, timeline.meta.home_team.color, p.colorT);
    }
    const pulse = 6 + Math.sin(el / 130) * 2.5;
    ctx.fillStyle = tipColor;
    ctx.shadowColor = tipColor;
    ctx.shadowBlur = 24;
    ctx.beginPath();
    ctx.arc(tipX, tipY, pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // active effects
    activeEffects = activeEffects.filter(fx => {
      const age = el - fx.t0;
      if (fx.type === 'goal') {
        const pt = fx.data.x !== undefined ? fx.data : curveYAtMinute(curve, fx.data.continuous_minute, samplesPerMinute);
        if (age > GOAL_EFFECT_MS) return false;
        drawGoalFlash(timeline, pt, age, GOAL_EFFECT_MS);
        return true;
      }
      if (fx.type === 'card') {
        const isRed = fx.data.card.toLowerCase().includes('red') || fx.data.card.toLowerCase().includes('second');
        const dur = isRed ? CARD_EFFECT_MS.red : CARD_EFFECT_MS.yellow;
        if (age > dur) return false;
        const pt = curveYAtMinute(curve, fx.data.continuous_minute, samplesPerMinute);
        drawCardStutter(pt, isRed, age, dur);
        return true;
      }
      if (fx.type === 'miss') {
        if (age > MISS_EFFECT_MS) return false;
        drawMissThud(fx.data, age, MISS_EFFECT_MS);
        return true;
      }
      return false;
    });

    bump = Math.max(0, bump - 0.06);
    const statusText = kickIndex >= 0 ? 'PENALTIES' : liveClockLabel(minute, timeline);
    drawScoreline(timeline, score, bump, pensShown, statusText);
    drawVignette();
  }

  let rafId = null;
  function frame(now) {
    const el = now - frame.startPerf;
    renderFrame(Math.min(el, totalMs));
    if (el < totalMs) {
      rafId = requestAnimationFrame(frame);
    } else {
      devnote.textContent = 'done';
    }
  }

  function play() {
    resetState();
    playBtn.style.display = 'none';
    frame.startPerf = performance.now();
    rafId = requestAnimationFrame(frame);
  }
  playBtn.addEventListener('click', play);

  // ?record=1: hide interactive chrome, hold the idle poster for a clean
  // 2s lead-in, then play exactly once — for screen recording.
  const isRecord = params.get('record') === '1';
  if (isRecord) {
    playBtn.style.display = 'none';
    devnote.style.display = 'none';
    setTimeout(play, 2000);
  }

  // Debug-only hook for verification screenshots — fast-forwards trigger
  // detection to `ms` in coarse steps, then renders that instant. Not part
  // of the shipped playback path.
  window.__seekTo = function (ms) {
    resetState();
    playBtn.style.display = 'none';
    const step = 40;
    for (let e = 0; e < ms; e += step) {
      const st = currentPlayheadAndKick(e);
      detectTriggers(e, st.minute, st.kickIndex, st.kickPhase);
    }
    renderFrame(ms);
  };
  window.__totalMs = totalMs;

  await Promise.all([
    document.fonts.load('500 32px Teko'),
    document.fonts.load('700 58px Teko'),
  ]);
  drawIdle();
}

main();
</script>
</body>
</html>
